<img
  src="{{ .SiteURL }}/email/jword-logo.png"
  width="260"
  height="81"
  alt="Jword"
  style="
    display: block;
    width: 260px;
    max-width: 100%;
    height: auto;
    margin: 0 auto 24px;
    border: 0;
    outline: none;
    text-decoration: none;
  "
/>
<h2>Welcome to jword</h2>
<p>Your one-time code is:</p>
<p style="font-size: 24px; font-weight: 600; letter-spacing: 4px">{{ .Token }}</p>
<p>Or use this link:</p>
<p>
  <a href="{{ .SiteURL }}/auth/callback?token_hash={{ .TokenHash }}&amp;type=email"
    >Finish signing in to jword</a
  >
</p>
<p>This code and link expire in one hour. If you did not request this, ignore this email.</p>
