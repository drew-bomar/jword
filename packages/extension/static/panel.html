<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>jword</title>
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }
      iframe {
        border: 0;
        display: block;
        height: 100%;
        width: 100%;
      }
      #notice {
        font:
          14px system-ui,
          sans-serif;
        padding: 16px;
      }
      #notice[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div id="notice" hidden>
      <p>jword capture needs permission to open your jword site.</p>
      <button type="button" id="open-options">Open options</button>
    </div>
    <iframe title="jword capture" allow="clipboard-write"></iframe>
    <script src="panel.js"></script>
  </body>
</html>
